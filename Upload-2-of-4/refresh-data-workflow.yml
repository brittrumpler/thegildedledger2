# Optional: copy to .github/workflows/refresh-data.yml in your GitHub repository.
# Cloudflare's connected Git repository deploys the resulting commit.
name: Refresh public treasure data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 0'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/sync_data.py --images
      - run: python3 scripts/sync_acquisition.py
      - run: npm run build
      - run: npm test
      - name: Commit public source snapshots
        run: |
          git config user.name "gilded-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/image-packs app.bundle.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public treasure values and acquisition routes"
            git push
          fi
