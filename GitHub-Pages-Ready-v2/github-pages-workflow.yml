name: Refresh data and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh upstream catalog and bulk price tables
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: python3 scripts/sync_data.py --images
      - name: Refresh individual value sources (weekly)
        if: github.event_name == 'schedule' && vars.REFRESH_ITEM_DETAILS == 'true'
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            python3 scripts/enrich_data.py --refresh --images
          fi
      - name: Prepare image packs and static site
        run: npm run build
      - name: Test calculations and data integrity
        run: npm test
      - name: Save refreshed facts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "gilded-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/image-packs app.bundle.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh treasure catalog and source values"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
